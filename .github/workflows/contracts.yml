# SPDX-License-Identifier: Apache-2.0
name: contracts

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # --no-build-isolation needs the PEP 517 backend already present, and the
      # Python 3.12 runner image no longer preinstalls setuptools.
      - run: python -m pip install setuptools wheel
      - run: python -m pip install --no-build-isolation -e tools/nova-contract
      - run: nova-contract validate contracts
      - run: nova-contract normalize contracts --check
      - run: nova-contract lint contracts
      - run: nova-contract matrix contracts --check
      - run: nova-contract context .
      - run: nova-contract boundaries canon/dependency-policy.yaml implementations/rust
      - run: python -m unittest discover -s tools/nova-contract/tests
      - run: python tools/check_repository_shape.py
      - run: python tools/check_agent_instructions.py
      - run: python tools/check_terminology.py
      - run: python tools/check_licenses.py
      - run: python tools/check_simulation_fixtures.py
      - run: python tools/generate_repository_docs.py --check
      - if: github.event_name == 'pull_request'
        run: |
          python tools/ci/check_contract_versions.py "${{ github.event.pull_request.base.sha }}"
          python tools/ci/check_dco.py \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"
