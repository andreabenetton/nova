# SPDX-License-Identifier: Apache-2.0
schema_version: "1.0"
policy_id: "NOVA-LICENSING-1"

licenses:
  AGPL-3.0-or-later:
    text: "LICENSES/AGPL-3.0-or-later.txt"
    role: "reciprocal core software"
  Apache-2.0:
    text: "LICENSES/Apache-2.0.txt"
    role: "permissive integration and tooling software"
  CC-BY-4.0:
    text: "LICENSES/CC-BY-4.0.txt"
    role: "documentation and specification prose"
  Apache-2.0 OR CC-BY-4.0:
    texts:
      - "LICENSES/Apache-2.0.txt"
      - "LICENSES/CC-BY-4.0.txt"
    role: "machine-readable contracts, schemas, registries, and fixtures"
  LicenseRef-Nova-Research-Draft-Restricted:
    text: "LICENSES/LicenseRef-Nova-Research-Draft-Restricted.txt"
    role: "historical research sources pending rights review"

agpl_core_crates:
  - "nova-ip-over-nova"
  - "nova-node"
  - "nova-o-stratum"
  - "nova-p-0ap"
  - "nova-p-0ap-control"
  - "nova-p-core"
  - "nova-p-lap"
  - "nova-p-rap"
  - "nova-r-stratum"

apache_integration_and_sdk_crates:
  - "nova-conformance"
  - "nova-interface-ip-gateway-egress"
  - "nova-interface-ip-platform-attachment"
  - "nova-interface-o-a"
  - "nova-interface-p-0ap-control"
  - "nova-interface-p-lap-adapter"
  - "nova-interface-p-path-provider"
  - "nova-interface-p-r"
  - "nova-interface-p-rap-binding"
  - "nova-interface-r-facility"
  - "nova-interface-r-o"
  - "nova-interface-virtual-fabric"
  - "nova-ip-platform-linux"
  - "nova-ip-platform-macos"
  - "nova-ip-platform-windows"
  - "nova-p-lap-ethernet"
  - "nova-p-lap-simulated-adapter"
  - "nova-p-rap-ipv4-quic"
  - "nova-p-rap-ipv6-quic"
  - "nova-p-rap-quic-common"
  - "nova-p-rap-simulated-binding"
  - "nova-types"
  - "nova-virtual-fabric"

rules:
  - pattern: "research/original-papers/**"
    license: "LicenseRef-Nova-Research-Draft-Restricted"
    spdx_header: false

  - pattern: "implementations/rust/crates/nova-ip-over-nova/**"
    license: "AGPL-3.0-or-later"
  - pattern: "implementations/rust/crates/nova-node/**"
    license: "AGPL-3.0-or-later"
  - pattern: "implementations/rust/crates/nova-o-stratum/**"
    license: "AGPL-3.0-or-later"
  - pattern: "implementations/rust/crates/nova-p-0ap/**"
    license: "AGPL-3.0-or-later"
  - pattern: "implementations/rust/crates/nova-p-0ap-control/**"
    license: "AGPL-3.0-or-later"
  - pattern: "implementations/rust/crates/nova-p-core/**"
    license: "AGPL-3.0-or-later"
  - pattern: "implementations/rust/crates/nova-p-lap/**"
    license: "AGPL-3.0-or-later"
  - pattern: "implementations/rust/crates/nova-p-rap/**"
    license: "AGPL-3.0-or-later"
  - pattern: "implementations/rust/crates/nova-r-stratum/**"
    license: "AGPL-3.0-or-later"

  - pattern: "implementations/rust/crates/**"
    license: "Apache-2.0"

  - pattern: "contracts/**"
    license: "Apache-2.0 OR CC-BY-4.0"
    spdx_header: false
    reason: "published versions and canonical output are immutable"
  - pattern: "schemas/**"
    license: "Apache-2.0 OR CC-BY-4.0"
  - pattern: "canon/registries/**"
    license: "Apache-2.0 OR CC-BY-4.0"
  - pattern: "simulation/**"
    license: "Apache-2.0 OR CC-BY-4.0"
  - pattern: "generated/documentation/**"
    license: "Apache-2.0 OR CC-BY-4.0"
    spdx_header: false
  - pattern: "generated/**"
    license: "Apache-2.0"
    spdx_header: false

  - pattern: ".github/**"
    license: "Apache-2.0"
  - pattern: ".gemini/**"
    license: "Apache-2.0"
    spdx_header: false
  - pattern: "agents/**"
    license: "Apache-2.0"
  - pattern: "benchmarks/**"
    license: "Apache-2.0"
  - pattern: "examples/**"
    license: "Apache-2.0"
  - pattern: "fuzz/**"
    license: "Apache-2.0"
  - pattern: "integrations/**"
    license: "Apache-2.0"
  - pattern: "packaging/**"
    license: "Apache-2.0"
  - pattern: "tests/**"
    license: "Apache-2.0"
  - pattern: "tools/**"
    license: "Apache-2.0"

  - pattern: "adr/**"
    license: "CC-BY-4.0"
  - pattern: "canon/**"
    license: "CC-BY-4.0"
  - pattern: "compatibility/**"
    license: "CC-BY-4.0"
  - pattern: "docs/**"
    license: "CC-BY-4.0"
  - pattern: "protocols/**"
    license: "CC-BY-4.0"
  - pattern: "research/**"
    license: "CC-BY-4.0"
  - pattern: "patents/**"
    license: "CC-BY-4.0"

  - pattern: "implementations/**"
    license: "CC-BY-4.0"

  - pattern: "legal/**"
    license: "Apache-2.0"

  - pattern: "AGENTS.md"
    license: "Apache-2.0"
  - pattern: "CLAUDE.md"
    license: "Apache-2.0"
    spdx_header: false
    reason: "managed Claude adapter must contain only @AGENTS.md"
  - pattern: "CONTEXT.yaml"
    license: "Apache-2.0"
  - pattern: "Cargo.toml"
    license: "Apache-2.0"
  - pattern: "Makefile"
    license: "Apache-2.0"
  - pattern: "NOTICE"
    license: "Apache-2.0"
    spdx_header: false
  - pattern: "rust-toolchain.toml"
    license: "Apache-2.0"
  - pattern: ".editorconfig"
    license: "Apache-2.0"
  - pattern: ".gitattributes"
    license: "Apache-2.0"
  - pattern: ".gitignore"
    license: "Apache-2.0"

  - pattern: "README.md"
    license: "CC-BY-4.0"
  - pattern: "CHANGELOG.md"
    license: "CC-BY-4.0"
  - pattern: "CONTRIBUTING.md"
    license: "CC-BY-4.0"
  - pattern: "COPYRIGHT.md"
    license: "CC-BY-4.0"
  - pattern: "LICENSE-NOTICE.md"
    license: "CC-BY-4.0"
  - pattern: "PATENTS.md"
    license: "CC-BY-4.0"
  - pattern: "REPOSITORY-MAP.md"
    license: "CC-BY-4.0"
  - pattern: "ROADMAP.md"
    license: "CC-BY-4.0"
  - pattern: "SECURITY.md"
    license: "CC-BY-4.0"
  - pattern: "STATUS.md"
    license: "CC-BY-4.0"
  - pattern: "THIRD_PARTY_NOTICES.md"
    license: "CC-BY-4.0"
  - pattern: "TRADEMARKS.md"
    license: "CC-BY-4.0"
  - pattern: "VALIDATION.md"
    license: "CC-BY-4.0"

exempt_files:
  - "LICENSE"
  - "LICENSE.md"
  - "DCO"
  - "LICENSES/**"
  - "**/LICENSE.md"

comment_styles:
  ".md": "html"
  ".py": "hash"
  ".yaml": "hash"
  ".yml": "hash"
  ".toml": "hash"
  ".rs": "slash"
  ".txt": "hash"
  "Makefile": "hash"
  ".editorconfig": "hash"
  ".gitattributes": "hash"
  ".gitignore": "hash"
