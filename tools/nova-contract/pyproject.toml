# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-contract"
version = "0.1.0"
description = "Experimental Nova NIDL contract tooling"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.22,<5",
]

[project.scripts]
nova-contract = "nova_contract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
