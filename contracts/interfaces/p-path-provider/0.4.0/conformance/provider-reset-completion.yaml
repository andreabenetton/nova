$schema: ../../../../schemas/nidl/0.1/conformance.schema.json
nidl: '0.1'
scenario:
  id: PPP04-RESET-001
  interface: NOVA-IF-P-PATH-PROVIDER
  version: 0.4.0
  role: provider
  description: Provider reset terminally completes accepted Submissions
  steps:
  - action: accept Provider Submissions S1 and S2 in generation G
  - action: initiate provider reset
  - action: emit exactly one PROVIDER_RESET completion for S1 and S2
  - action: emit provider-reset as the final event of G
  - action: reject every later reference to identifiers from G
