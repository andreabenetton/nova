
$schema: "../../../../schemas/nidl/0.1/conformance.schema.json"
nidl: "0.1"
scenario:
  id: "PPP-CONF-P0AP-LIFECYCLE-001"
  interface: "NOVA-IF-P-PATH-PROVIDER"
  version: "0.2.0"
  role: "provider"
  description: "A P-0AP provider exposes ordinary Path lifecycle without leaking simulation control metadata."
  steps:
    - action: "activate provider"
    - action: "emit provider-path-added with an existing modeled Path kind"
    - action: "accept and deliver an SDU for the active provider Path"
    - action: "emit provider-path-removed"
    - action: "assert no later conforming delivery for the removed generation"
    - action: "assert no control, seed, Virtual Fabric, or profile identifier appears in the provider event"
