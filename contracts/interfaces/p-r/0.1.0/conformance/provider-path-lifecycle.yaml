$schema: "../../../../schemas/nidl/0.1/conformance.schema.json"
nidl: "0.1"
scenario:
  id: "PR-CONF-PATH-LIFECYCLE-001"
  interface: "NOVA-IF-P-R"
  version: "0.1.0"
  role: "provider"
  description: "A provider announces a Path before delivering an SDU on it and does not deliver after removal."
  steps:
    - action: "emit path-added"
    - action: "emit sdu-delivered for announced Path"
    - action: "emit path-removed"
    - action: "assert no later sdu-delivered for removed Path generation"
