$schema: ../../../../schemas/nidl/0.1/conformance.schema.json
nidl: '0.1'
scenario:
  id: PR02-PROVIDER-SDU-001
  interface: NOVA-IF-P-R
  version: 0.2.0
  role: provider
  description: Complete SDU boundary is preserved
  steps:
  - action: accept one SDU of length L
  - action: transport it using any number of private fragments
  - action: emit at most one peer-side complete SDU with exactly L bytes
  - action: do not expose fragments through P-R
