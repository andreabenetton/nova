$schema: ../../../../schemas/nidl/0.1/conformance.schema.json
nidl: '0.1'
scenario:
  id: PR02-PROVIDER-OPEN-001
  interface: NOVA-IF-P-R
  version: 0.2.0
  role: provider
  description: Opening an empty provider returns one coherent snapshot and continuation
    sequence
  steps:
  - action: call open-interface with 0.2.0 supported
  - action: expect a new InterfaceInstanceId, empty initial_edges, and next_event_sequence
  - action: assert no Edge event has a sequence lower than next_event_sequence
