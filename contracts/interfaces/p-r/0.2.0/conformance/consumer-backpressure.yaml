$schema: ../../../../schemas/nidl/0.1/conformance.schema.json
nidl: '0.1'
scenario:
  id: PR02-CONSUMER-BACKPRESSURE-001
  interface: NOVA-IF-P-R
  version: 0.2.0
  role: consumer
  description: Consumer waits for capacity notification
  steps:
  - action: receive WOULD_BLOCK for an unaccepted Submission
  - action: retain ownership of the SDU
  - action: do not busy-poll submit-sdu
  - action: retry only after submission-capacity-available or another explicit policy
      trigger
