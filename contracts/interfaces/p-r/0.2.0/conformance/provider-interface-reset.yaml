$schema: ../../../../schemas/nidl/0.1/conformance.schema.json
nidl: '0.1'
scenario:
  id: PR02-PROVIDER-RESET-001
  interface: NOVA-IF-P-R
  version: 0.2.0
  role: provider
  description: Reset invalidates all runtime identifiers
  steps:
  - action: open Interface I and add Edge E
  - action: accept Submission S
  - action: emit submission-completed for S with INTERFACE_RESET
  - action: emit interface-reset as the final event for I
  - action: treat E, its PeerHandle, S, and event sequence as invalid
  - action: require a new open-interface and fresh snapshot
