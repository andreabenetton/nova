$schema: ../../../../schemas/nidl/0.1/conformance.schema.json
nidl: '0.1'
scenario:
  id: PR02-CONSUMER-DEGREE-002
  interface: NOVA-IF-P-R
  version: 0.2.0
  role: consumer
  description: Stale Obfuscated degree blocks new expansion but not Edge data use
  steps:
  - action: receive an Edge snapshot whose degree later reaches its validity limit
  - action: continue using an otherwise active service profile for SDU submission
  - action: do not begin new topology expansion from the stale degree
  - action: resume expansion only after a fresh edge-updated value arrives
