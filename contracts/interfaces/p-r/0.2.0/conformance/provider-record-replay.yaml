$schema: ../../../../schemas/nidl/0.1/conformance.schema.json
nidl: '0.1'
scenario:
  id: PR02-PROVIDER-REPLAY-001
  interface: NOVA-IF-P-R
  version: 0.2.0
  role: provider
  description: P-0AP record replay produces identical P-R trace
  steps:
  - action: run a fixed deterministic scenario and record the P-R observable trace
  - action: reset and replay the same scenario
  - action: assert responses, events, identifiers under deterministic allocation,
      and event sequences match
